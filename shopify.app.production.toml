# RipsPriceX production — https://pricefy.echologyx.com
# EchoLogyx Ltd Partner app (shopify.app.toml / client 1427bfea…).
# Deploy: shopify app deploy --config shopify.app.production.toml --allow-updates
# Do not enable automatically_update_urls_on_dev here (would clobber this host).

name = "rips-pricex"
client_id = "1427bfea71317ff9999f4ad85b59675b"
application_url = "https://pricefy.echologyx.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_products,write_products,read_orders,read_inventory,read_locations,read_cart_transforms,write_cart_transforms,read_discounts,write_discounts,read_themes,read_content,read_online_store_pages,read_markets,read_reports"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://pricefy.echologyx.com/auth/callback",
  "https://pricefy.echologyx.com/auth/shopify/callback",
  "https://pricefy.echologyx.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[app_proxy]
url = "https://pricefy.echologyx.com/api/proxy"
subpath = "ripspricex"
prefix = "apps"

[pos]
embedded = false
